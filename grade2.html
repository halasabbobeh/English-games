<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>In the kitchen – Grade 2</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff3e2;--card:#fff;--ink:#4a2a2a;--accent:#e8503a;--accent2:#ffd23f;--ok:#2ea44f;--bad:#c62828;--soft:#ffe6cc;--pink:#3f8f5b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f3d;--card:#3a2b55;--ink:#f6f0ff;--soft:#4b3a6e}}
:root[data-theme="dark"]{--bg:#2a1f3d;--card:#3a2b55;--ink:#f6f0ff;--soft:#4b3a6e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.12);text-align:center}
h1{font-size:2.1rem;margin:.1em 0;color:var(--accent)}
.big{font-size:4.2rem}.bounce{display:inline-block;animation:bn 1.4s infinite}
@keyframes bn{50%{transform:translateY(-10px)}}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent2);border:0;border-radius:18px;padding:12px 30px;font-size:1.25rem;font-weight:bold;color:#3b2a63;box-shadow:0 5px 0 #c99a00}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.alt{background:var(--soft);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.14)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:1.05rem;margin-bottom:6px}
.chip{background:var(--soft);border-radius:20px;padding:4px 12px}
.track{position:relative;height:14px;background:var(--soft);border-radius:10px;margin:10px 4px 18px}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:width .5s}
.track b{position:absolute;top:-10px;font-size:1.5rem;transition:left .5s;transform:translateX(-50%)}
.rooms{display:flex;justify-content:space-between;font-size:1.4rem;margin:-8px 2px 8px}
.rooms span{filter:grayscale(1);opacity:.4;transition:.4s}.rooms span.on{filter:none;opacity:1;transform:scale(1.2)}
.mode{display:inline-block;background:var(--pink);color:#fff;border-radius:14px;padding:3px 12px;font-size:.9rem;font-weight:bold;margin-bottom:6px}
.scene{font-size:3.4rem;line-height:1.1;margin:6px 0}
.q{font-size:1.45rem;font-weight:bold;margin:6px 0}
.sent{font-size:1.2rem;background:var(--soft);border-radius:14px;padding:10px;margin:6px 0}
.speak{background:var(--accent);color:#fff;border:0;border-radius:50%;width:54px;height:54px;font-size:1.5rem;box-shadow:0 4px 0 #b44a22}
.hint{display:none;direction:rtl;font-size:1rem;opacity:.85;margin:6px 0}.hint.show{display:block}
.hbtn{background:none;border:0;font-size:.9rem;text-decoration:underline;opacity:.7;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{background:var(--soft);color:var(--ink);border:3px solid transparent;border-radius:18px;padding:10px 6px;font-size:1.05rem;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.opt .e{display:block;font-size:2.3rem}.opt:active{transform:scale(.96)}
.opt.ok{background:#c9f2d3;border-color:var(--ok);color:#124d22}
.opt.bad{background:#ffd9da;border-color:var(--bad);color:#6a1215;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.line{min-height:58px;border-bottom:3px dashed var(--accent);margin:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px}
.w{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:8px 14px;font-size:1.2rem;font-weight:bold;box-shadow:0 3px 0 #b44a22}
.w.p{background:var(--accent2);color:#3b2a63;box-shadow:0 3px 0 #c99a00}
.row{display:flex;gap:10px;justify-content:center;margin-top:10px}
.msg{min-height:30px;font-size:1.2rem;font-weight:bold;margin-top:10px}
.pop{animation:pop .5s}@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.stats{display:flex;justify-content:space-around;margin:12px 0;gap:6px}
.stats div{background:var(--soft);border-radius:16px;padding:8px 10px;font-weight:bold;font-size:.9rem}
.stats b{display:block;font-size:1.6rem}
.conf{position:fixed;top:-40px;font-size:1.8rem;pointer-events:none;animation:fall 1.8s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<script>
const TEACHER="Hala Sabbobeh";
const F=[["🍗","chicken"],["🐟","fish"],["🍚","rice"],["🥗","salad"],["🥩","meat"],["🍫","chocolate"],["🍦","ice cream"],["🍉","melon"],["🍎","apples"],["🍊","oranges"]];
const FD=n=>F.filter(x=>n.includes(x[1]));
const TF=[["✔","True"],["✘","False"]];
const Q=[
 {m:"👂 Listen & Tap",t:"c",hide:1,say:"I like chicken.",q:"What do I like?",scene:"🔊",opts:FD(["chicken","fish","rice","salad"]),a:"chicken",ar:"اسمع الجملة واختار الأكل الصح."},
 {m:"👀 Look & Choose",t:"c",say:"I like salad.",q:"What do you like?",scene:"🥗",sent:"I like ____.",opts:FD(["salad","rice","fish","meat"]),a:"salad",ar:"شو هاد الأكل؟"},
 {m:"🔢 Count It!",t:"c",say:"How many olives? Twelve.",q:"How many olives?",scene:"🫒🫒🫒🫒🫒🫒🫒🫒🫒🫒🫒🫒",ss:"2.1rem",opts:[["🔢","11"],["🔢","12"],["🔢","13"],["🔢","10"]],a:"12",ar:"عدّ الزيتون واختار الرقم."},
 {m:"🧒 Who Likes?",t:"c",say:"What does Zaid like? He likes chocolate.",q:"What does Zaid like?",scene:"👦",opts:FD(["chocolate","ice cream","rice","meat"]),a:"chocolate",ar:"شو بيحب زيد؟"},
 {m:"✏️ He or She?",t:"c",say:"She likes ice cream.",q:"Who likes ice cream?",scene:"👧🍦",sent:"____ likes ice cream.",opts:[["👦","He"],["👧","She"]],a:"She",ar:"البنت: She، والولد: He."},
 {m:"🔤 Spelling Star",t:"o",say:"rice",q:"Spell the word!",scene:"🍚",toks:"rice".split(""),sep:"",a:"rice",ar:"رتّب الحروف لتكتب الكلمة."},
 {m:"✔ True or False?",t:"c",say:"I like chicken.",q:"Is it true?",scene:"🍉",sent:"I like chicken.",opts:TF,a:"False",ar:"الصورة بطيخ (melon). الجملة صحيحة أو خطأ؟"},
 {m:"🧩 Build the Sentence",t:"o",say:"I like rice.",q:"What do you like?",scene:"🍚😋",toks:["I","like","rice"],sep:" ",a:"I like rice",ar:"رتّب الكلمات لتكوّن جملة."},
 {m:"🔢 Count It!",t:"c",say:"How many nuts? Thirteen.",q:"How many nuts?",scene:"🥜🥜🥜🥜🥜🥜🥜🥜🥜🥜🥜🥜🥜",ss:"2rem",opts:[["🔢","12"],["🔢","13"],["🔢","11"],["🔢","10"]],a:"13",ar:"عدّ المكسرات واختار الرقم."},
 {m:"🏆 Boss Round",t:"o",say:"She likes chicken and salad.",q:"What does she like?",scene:"👧🍗🥗",toks:["She","likes","chicken","and","salad"],sep:" ",a:"She likes chicken and salad",ar:"رتّب الكلمات لتكوّن جملة طويلة!"}
];
const N=Q.length,ICONS=["🍗","🥗","🍚","🍦","🍫"];
let i,score,streak,best,first,tries,t0,done,toks,used,AC;
const app=document.getElementById("app"),$=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.75;speechSynthesis.speak(u)}catch(e){}};
const tone=(f,d,t="sine")=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}};
const good=()=>{tone(660,.15);setTimeout(()=>tone(880,.25),120)},badS=()=>tone(180,.3,"square");
function boom(){["⭐","🎉","✨","🍗","🍫"].forEach(e=>{for(let k=0;k<4;k++){const s=document.createElement("span");s.className="conf";s.textContent=e;s.style.left=Math.random()*95+"vw";s.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2500)}})}
function start(){i=0;score=0;streak=0;best=0;first=0;
 app.innerHTML=`<div class="card pop"><div class="big bounce">👩‍🍳</div><h1>In the kitchen</h1>
 <div class="sent">🍳 Welcome to <b>Mum's kitchen</b>!<br>Help us cook and find what everyone likes.<br>10 fun rounds · collect ⭐ · become a Super Chef!</div>
 <p>👩‍🏫 Teacher: <b>${TEACHER}</b><br>Unit 2 · Grade 2</p>
 <button class="btn" onclick="tone(520,.1);show()">▶ Let's go!</button></div>`}
function show(){const q=Q[i];tries=0;done=false;t0=Date.now();used=[];
 const pct=i/N*100,lit=Math.floor(i/N*5);
 let h=`<div class="card"><div class="top"><span class="chip">Round ${i+1}/${N}</span><span class="chip">⭐ ${score}</span><span class="chip">🔥 ${streak}</span></div>
 <div class="track"><i style="width:${pct}%"></i><b style="left:${Math.max(4,Math.min(pct,96))}%">👩‍🍳</b></div>
 <div class="rooms">${ICONS.map((e,k)=>`<span class="${k<lit?"on":""}">${e}</span>`).join("")}</div>
 <div class="mode">${q.m}</div><div class="scene"${q.ss?` style="font-size:${q.ss}"`:""}>${q.scene}</div><div class="q">${q.q}</div>`;
 if(q.sent)h+=`<div class="sent">${q.sent}</div>`;
 h+=`<button class="speak" onclick="say(Q[i].say)" aria-label="Listen">🔊</button>`;
 if(q.t==="c"){h+=`<div class="grid">`+sh(q.opts).map(o=>`<button class="opt" onclick="pick(this,'${o[1]}')"><span class="e">${o[0]}</span>${o[1]}</button>`).join("")+`</div>`}
 else{toks=sh(q.toks);h+=`<div class="line" id="line"></div><div class="pool" id="pool"></div>
  <div class="row"><button class="btn alt" onclick="clr()">↺ Clear</button><button class="btn" onclick="chk()">✔ Check</button></div>`}
 h+=`<div class="msg" id="msg"></div><div id="next"></div><button class="hbtn" onclick="$('hint').classList.toggle('show')">🇸🇦 عربي</button><div class="hint" id="hint">${q.ar}</div></div>`;
 app.innerHTML=h;if(q.t==="o")draw();setTimeout(()=>say(q.say),350)}
function msg(t,c){const m=$("msg");m.textContent=t;m.style.color=c}
function pick(el,a){if(done)return;const q=Q[i];
 if(a===q.a){el.classList.add("ok");win()}else{el.classList.add("bad");wrong(()=>{[...document.querySelectorAll(".opt")].forEach(b=>{if(b.textContent.trim().endsWith(q.a))b.classList.add("ok")})})}}
function draw(){
 $("line").innerHTML=used.map((k,n)=>`<button class="w" onclick="rm(${n})">${toks[k]}</button>`).join("");
 $("pool").innerHTML=toks.map((w,k)=>used.includes(k)?"":`<button class="w p" onclick="add(${k})">${w}</button>`).join("")}
function add(k){if(done)return;used.push(k);tone(500,.08);draw()}
function rm(n){if(done)return;used.splice(n,1);draw()}
function clr(){if(done)return;used=[];draw()}
function chk(){if(done)return;const q=Q[i];
 if(used.map(k=>toks[k]).join(q.sep)===q.a)win();
 else wrong(()=>{const left=toks.map((_,k)=>k);used=[];q.a.split(q.sep||"").forEach(w=>{const p=left.findIndex(k=>toks[k]===w);used.push(left[p]);left.splice(p,1)});draw()})}
function wrong(reveal){tries++;streak=0;badS();
 if(tries>=2){done=true;msg("The answer is: "+Q[i].a+" 💡","var(--bad)");reveal();say(Q[i].say);nextBtn()}
 else msg("Oops! Try again 💪","var(--bad)")}
function win(){done=true;const q=Q[i];let p=5;
 if(tries===0){streak++;best=Math.max(best,streak);first++;const fast=Date.now()-t0<10000;p=10+(fast?5:0)+2*Math.min(streak,5)}
 score+=p;good();boom();say(q.say);
 const praise=["Great job!","Awesome!","Super!","Fantastic!","Well done!"][Math.floor(Math.random()*5)];
 msg(`${praise} +${p} ⭐${streak>2?" 🔥 Combo x"+streak:""}`,"var(--ok)");
 if(q.hide)$("msg").insertAdjacentHTML("afterend",`<div class="sent">${q.say}</div>`);
 nextBtn()}
function nextBtn(){$("next").innerHTML=`<button class="btn pop" style="margin-top:10px" onclick="nextQ()">${i<N-1?"Next ➜":"Finish 🎉"}</button>`}
function nextQ(){i++;i<N?show():end()}
function end(){const r=first>=9?["🥇","Super Chef","Gold"]:first>=6?["🥈","Kitchen Helper","Silver"]:["🥉","Little Cook","Bronze"];
 boom();tone(784,.3);setTimeout(()=>tone(988,.4),200);
 app.innerHTML=`<div class="card pop"><div class="big bounce">${r[0]}</div><h1>${r[1]}!</h1>
 <p>${r[2]} medal · Amazing work!</p>
 <div class="stats"><div><b>${score}</b>⭐ Points</div><div><b>${first}/${N}</b>✔ First try</div><div><b>${best}</b>🔥 Best combo</div></div>
 <p>👩‍🏫 <b>${TEACHER}</b></p>
 <button class="btn" onclick="start()">↺ Play again</button></div>`;say("Well done! You are a "+r[1])}
start();
</script>
</body>
</html>
